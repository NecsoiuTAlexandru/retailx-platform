<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetailX · aplicația</title>
<style>
  :root { --verde:#1f5c4a; --verde-soft:#e3efe9; --rosu:#b3261e; --galben:#8a5a00; --galben-soft:#fbf1dc;
          --fond:#ebe8e1; --card:#fff; --text:#1d2420; --gri:#66706b; --linie:#e2e0d9; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--fond); color:var(--text); }
  .telefon { max-width:400px; min-height:100vh; margin:0 auto; background:#faf9f6; display:flex; flex-direction:column; }
  .sus { padding:16px 18px 8px; } .sus h1 { margin:0; font-size:22px; } .mic { color:var(--gri); font-size:13px; }
  .continut { flex:1; padding:8px 18px 90px; display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--card); border:1px solid var(--linie); border-radius:14px; padding:14px; }
  .linie { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--linie); }
  .linie:first-child { border-top:0; }
  .alerta { font-size:13px; padding:6px 10px; border-radius:8px; margin-top:4px; }
  .alerta.pret { background:var(--galben-soft); color:var(--galben); } .alerta.stoc { background:#fbe5e3; color:var(--rosu); }
  nav { position:sticky; bottom:0; display:flex; justify-content:space-around; background:#fff; border-top:1px solid var(--linie); padding:10px 0 14px; }
  nav button { border:0; background:none; font:inherit; font-size:13px; color:var(--gri); cursor:pointer; }
  nav button[aria-current="page"] { color:var(--verde); font-weight:700; }
  .btn { background:var(--verde); color:#fff; border:0; border-radius:10px; padding:12px; font:inherit; font-weight:600; width:100%; cursor:pointer; }
</style>
</head>
<body>
<div class="telefon">
  <div class="sus"><h1 id="titlu">Coșul tău</h1><div class="mic" id="subtitlu">Ana P. · același coș ca pe website</div></div>
  <div class="continut" id="ecran"></div>
  <nav id="nav">
    <button data-ecran="cos" aria-current="page">Coș</button>
    <button data-ecran="comenzi">Comenzi</button>
  </nav>
</div>

<script>
const CLIENT = "ana";
const $ = (id) => document.getElementById(id);
const leiFmt = (b) => (b / 100).toLocaleString("ro-RO", { minimumFractionDigits: 2 }) + " lei";
const api = async (url, opt = {}) => {
  const r = await fetch(url, { headers: { "content-type": "application/json" }, ...opt, body: opt.body && JSON.stringify(opt.body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.eroare || "Eroare"), { data });
  return data;
};
let produse = {};
const ECRANE = {};

// ---------- S3 · US-05: același coș, cu prețul și stocul reverificate ----------
ECRANE.cos = { titlu: "Coșul tău", subtitlu: "Ana P. · același coș ca pe website", async randeaza() {
  const { cos, verificare } = await api(`/api/clienti/${CLIENT}/cos?canal=aplicatie`);
  if (!cos.linii.length) return '<div class="card mic">Coșul e gol. Adaugă produse pe website după ce intri în cont ca Ana.</div>';
  const randuri = verificare.map((v) => `
    <div class="linie"><div>${v.cantitate} × ${produse[v.codProdus]?.denumire ?? v.codProdus}
      ${v.pretModificat ? `<div class="alerta pret">Prețul s-a schimbat: ${leiFmt(v.pretLaAdaugare)} → ${leiFmt(v.pretCurent)}</div>` : ""}
      ${v.stocInsuficient ? `<div class="alerta stoc">${v.eticheta === "neconfirmat" ? "Disponibilitate neconfirmată" : `Mai sunt ${v.disponibil ?? 0} buc. în magazinul ales`}</div>` : ""}
    </div><b>${leiFmt(v.pretCurent * v.cantitate)}</b></div>`).join("");
  return `<div class="card">${randuri}</div><p class="mic">Prețul și stocul au fost reverificate la deschidere.</p>`;
}};

// ---------- S4 · US-07, US-09: statusul comenzii, înlocuirile și codul de ridicare ----------
const PASI = [["Confirmata", "Confirmată"], ["InPregatire", "În pregătire"], ["GataDeRidicare", "Gata de ridicare"], ["InLivrare", "În livrare"], ["Onorata", "Onorată"]];
const ora = (ms) => new Date(ms).toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" });
ECRANE.comenzi = { titlu: "Comenzile tale", subtitlu: "Statusul se actualizează automat", async randeaza() {
  const comenzi = (await api(`/api/clienti/${CLIENT}/comenzi`)).filter((c) => c.status !== "InPlata").reverse();
  if (!comenzi.length) return '<div class="card mic">Nu ai încă nicio comandă.</div>';
  return comenzi.map((c) => {
    const pasi = PASI.filter(([s]) => s !== (c.tipPrimire === "ridicare" ? "InLivrare" : "GataDeRidicare"));
    const atins = Object.fromEntries(c.istoric.map((h) => [h.status, h.la]));
    const inlocuiri = c.linii.filter((l) => l.inlocuire).map((l) =>
      `<div class="alerta pret"><b>1 produs înlocuit</b>, cum ai ales: ${l.denumire} → ${l.inlocuire.denumire}.${l.inlocuire.diferentaRambursata ? ` Diferența de ${leiFmt(l.inlocuire.diferentaRambursata)} a fost rambursată.` : ""}</div>`).join("");
    const eliminate = c.linii.filter((l) => l.eliminata).map((l) => `<div class="alerta stoc">${l.denumire} lipsea; suma a fost rambursată.</div>`).join("");
    const cod = c.status === "GataDeRidicare" && c.primire?.codRidicare
      ? `<div style="border:2px dashed var(--verde);border-radius:12px;text-align:center;padding:10px;margin-top:8px"><div class="mic">Arată acest cod la ridicare</div><div style="font-size:30px;font-weight:800;letter-spacing:.2em">${c.primire.codRidicare}</div></div>`
      : "";
    const urmarire = c.status === "InLivrare" && c.primire?.linkUrmarire ? `<a href="${c.primire.linkUrmarire}" target="_blank">Urmărește livrarea</a>` : "";
    return `<div class="card"><b>Comanda #${c.nrComanda}</b><div class="mic">${c.tipPrimire === "ridicare" ? "Ridicare" : "Livrare"} · ${c.primire?.interval ?? ""}</div>
      ${c.status === "Anulata" ? '<div class="alerta stoc">Comanda a fost anulată; suma se rambursează pe card.</div>' : ""}
      ${pasi.map(([s, eticheta]) => `<div class="linie"><span>${atins[s] ? "✓" : "○"} ${eticheta}</span><span class="mic">${atins[s] ? ora(atins[s]) : ""}</span></div>`).join("")}
      ${inlocuiri}${eliminate}${cod}${urmarire}</div>`;
  }).join("");
}};

async function arata(ecran) {
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-current", b.dataset.ecran === ecran ? "page" : "false"));
  $("titlu").textContent = ECRANE[ecran].titlu;
  $("subtitlu").textContent = ECRANE[ecran].subtitlu;
  $("ecran").innerHTML = await ECRANE[ecran].randeaza();
  ECRANE[ecran].dupa?.();
}

(async () => {
  produse = Object.fromEntries((await api("/api/produse")).map((p) => [p.cod, p]));
  document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => arata(b.dataset.ecran)));
  arata("cos");
})();
</script>
</body>
</html>
